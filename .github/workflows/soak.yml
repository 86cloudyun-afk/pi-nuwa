name: soak

# 72h 长测必须跑在自托管 runner：GitHub 托管 runner 单作业上限 6 小时。
on:
  workflow_dispatch:
    inputs:
      minutes:
        description: "长测分钟数"
        required: true
        default: "4320"
  schedule:
    - cron: "0 3 * * 0"

jobs:
  soak:
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 4500
    env:
      SAPPER_REF: c91881dc1629409bbf278577dfdaa6b8f383b438
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run soak
        run: |
          MIN="${{ github.event.inputs.minutes || '4320' }}"
          # R7 起替换为 nuwa soak；当前 tests/soak.py 仅作 preview，不可用于发布验收
          python3 tests/soak.py --minutes "$MIN" --interval 30 --instances 4 --out soak-report
          echo "${{ github.sha }}" > soak-report/COMMIT
          echo "preview" > soak-report/MODE

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: soak-preview-${{ github.sha }}
          path: soak-report/
