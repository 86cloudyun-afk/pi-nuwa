name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  suite:
    runs-on: ubuntu-latest
    env:
      SAPPER_REF: c91881dc1629409bbf278577dfdaa6b8f383b438
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install sapper CLI
        run: |
          git clone https://github.com/86cloudyun-afk/sapper-v2.git /tmp/sapper-v2
          git -C /tmp/sapper-v2 checkout "$SAPPER_REF"
          bash /tmp/sapper-v2/install.sh --cli-only

      - name: Full suite (contract + five suites + gates)
        env:
          NUWA_REQUIRE_GATES: "1"
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          ./tests/run.sh
