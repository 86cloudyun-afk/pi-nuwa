name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  suite:
    runs-on: ubuntu-latest
    env:
      SAPPER_REF: c91881dc1629409bbf278577dfdaa6b8f383b438
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install sapper CLI
        run: |
          git clone https://github.com/86cloudyun-afk/sapper-v2.git /tmp/sapper-v2
          git -C /tmp/sapper-v2 checkout "$SAPPER_REF"
          bash /tmp/sapper-v2/install.sh --cli-only

      - name: Unit tests
        run: |
          cd tests
          bun test unit.test.ts

      - name: Contract check
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          cd tests
          python3 contract_check.py

      - name: Protocol tests
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          cd tests
          python3 test_nuwa_shell.py

      - name: Chaos tests
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          cd tests
          python3 test_chaos.py

      - name: Concurrency tests
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          cd tests
          python3 test_concurrency.py

      - name: Deterministic E2E
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          cd tests
          python3 test_e2e_deterministic.py
