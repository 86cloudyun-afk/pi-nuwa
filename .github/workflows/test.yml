name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  suite:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install sapper CLI
        run: |
          git clone --depth 1 https://github.com/86cloudyun-afk/sapper-v2.git /tmp/sapper-v2
          bash /tmp/sapper-v2/install.sh --cli-only

      - name: Unit tests
        run: |
          cd tests
          bun test unit.test.ts

      - name: Protocol tests
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          cd tests
          python3 test_nuwa_shell.py

      - name: Chaos tests
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          cd tests
          python3 test_chaos.py

      - name: Concurrency tests
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          cd tests
          python3 test_concurrency.py

      - name: Deterministic E2E
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          cd tests
          python3 test_e2e_deterministic.py
